services:
  warehouse:
    image: postgres:16
    container_name: olist_warehouse
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - olist_data:/var/lib/postgresql/data

volumes:
  olist_data:
